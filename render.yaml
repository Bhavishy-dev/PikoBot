services:
  - type: worker
    name: pikobot-worker
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pikobot-db
          property: connectionString
      - key: ENVIRONMENT
        value: production

databases:
  - name: pikobot-db
    plan: free
    region: oregon
